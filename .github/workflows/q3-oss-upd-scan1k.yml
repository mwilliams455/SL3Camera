name: Q3 OSS UPD token scan 1K
on:
  workflow_dispatch:
  push:
    branches: [research/panasonic-lineage1k]
    paths:
      - 'tools/sl3p_q3_oss_upd_scan1k.py'
      - 'tests/test_q3_oss_upd_scan1k.py'
      - '.github/workflows/q3-oss-upd-scan1k.yml'
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - run: python scripts/check_public_tree.py
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - name: Scan official Q3 OSS U-Boot/Linux sources for exact UPD-family tokens
        run: python tools/sl3p_q3_oss_upd_scan1k.py
# Scans published source only; no camera firmware binary or artifact is handled.
