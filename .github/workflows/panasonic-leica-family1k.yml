name: Panasonic Leica UPD family comparison 1K
on:
  workflow_dispatch:
  push:
    branches: [research/panasonic-lineage1k]
    paths:
      - 'tools/sl3p_upd_family1k.py'
      - 'tools/sl3p_panasonic_leica_family1k.py'
      - 'tests/test_upd_family1k.py'
      - '.github/workflows/panasonic-leica-family1k.yml'
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.13'}
      - run: python scripts/check_public_tree.py
      - run: python -m unittest discover -s tests -q
      - run: python tools/sl3p_panasonic_leica_family1k.py
# Vendor binaries are temporary; only metadata/comparison results are logged.
