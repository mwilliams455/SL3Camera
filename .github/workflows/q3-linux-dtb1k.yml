name: Q3 Linux DTB plaintext probe 1K
on:
  workflow_dispatch:
  push:
    branches: [research/panasonic-lineage1k]
    paths: ['.github/workflows/q3-linux-dtb1k.yml']
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - run: python scripts/check_public_tree.py
      - name: Install DTB build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu bc bison flex libssl-dev
      - name: Build Q3 device trees from Leica-published Linux source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request,zipfile
          u='https://leica-camera.com/sites/default/files/pm-19562-OSS_codes.zip'
          req=urllib.request.Request(u,headers={'User-Agent':'SL3Camera-research/1K'})
          with urllib.request.urlopen(req,timeout=240) as r, open('/tmp/q3oss.zip','wb') as f:
              while True:
                  b=r.read(1024*1024)
                  if not b: break
                  f.write(b)
          with zipfile.ZipFile('/tmp/q3oss.zip') as z:
              n=next(n for n in z.namelist() if n.endswith('linux-4.19.124.tar.gz'))
              with z.open(n) as src, open('/tmp/linux.tar.gz','wb') as dst:
                  while True:
                      b=src.read(1024*1024)
                      if not b: break
                      dst.write(b)
          PY
          tar -xzf /tmp/linux.tar.gz -C /tmp
          cd /tmp/linux-4.19.124
          make -f Makefile ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- pvc04v_DC1231_defconfig
          make -f Makefile ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- PVCPF_SUBMODEL=DC1231 PVCPF_HW_VERSION= -j2 dtbs
          python - <<'PY'
          import hashlib,json,os,glob,struct
          wanted=glob.glob('arch/arm64/boot/dts/socionext/pvc04v-DC123*.dtb')
          out={}
          for p in wanted:
              d=open(p,'rb').read(); magic,total=struct.unpack('>II',d[:8])
              out[p]={'bytes':len(d),'sha256':hashlib.sha256(d).hexdigest(),
                      'fdt_magic':hex(magic),'fdt_totalsize':total,'first64_hex':d[:64].hex()}
          print('Q3_LINUX_DTB1K_JSON_BEGIN')
          print(json.dumps({'compiler':os.popen('aarch64-linux-gnu-gcc --version').read().splitlines()[0],
                            'program_base':hex(0x400200000),'documented_dtb_address':hex(0x401290000),
                            'relative_offset':hex(0x401290000-0x400200000),'outputs':out},separators=(',',':')))
          print('Q3_LINUX_DTB1K_JSON_END')
          PY
          rm -rf /tmp/q3oss.zip /tmp/linux.tar.gz /tmp/linux-4.19.124
# Built DTBs are measured and deleted; no binary artifacts are uploaded.
