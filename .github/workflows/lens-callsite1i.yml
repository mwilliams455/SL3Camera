name: Lens callsite evidence 1I
on:
  workflow_dispatch:
  push:
    branches: [research/lens-callsite1i]
    paths:
      - 'tools/sl3p_lens_callsite1i.py'
      - 'tools/sl3p_lens_semantics1i.py'
      - 'tests/test_lens_callsite1i.py'
      - '.github/workflows/lens-callsite1i.yml'
permissions:
  contents: read
concurrency:
  group: lens-callsite1i-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python scripts/check_public_tree.py
      - run: python -m pip install -r requirements-analysis.txt
      - run: python -m unittest discover -s tests -q
      - name: Trace pinned lens callsite without executing firmware
        run: python tools/sl3p_lens_callsite1i.py
# No binary artifacts, credentials retention, firmware execution or Git write-back.
