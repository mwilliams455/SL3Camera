name: Public loader source audit
on:
  push:
    branches: [research/loader-evidence1d]
    paths: [.github/workflows/oss-source-audit.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: Audit ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        part: [uboot, linux, freertos]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python scripts/check_public_tree.py
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Audit fixed public source member without extracting named paths
        run: python tools/sl3p_oss_audit.py --part '${{ matrix.part }}'
