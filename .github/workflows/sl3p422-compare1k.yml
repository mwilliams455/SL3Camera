name: SL3-P 4.2.2 inventory comparison 1K
on:
  workflow_dispatch:
  push:
    branches: [research/panasonic-lineage1k]
    paths:
      - 'tools/sl3p_sl3p422_compare1k.py'
      - 'tests/test_sl3p422_compare1k.py'
      - '.github/workflows/sl3p422-compare1k.yml'
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - run: python scripts/check_public_tree.py
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - name: Fetch official 4.2.2 and compare section fingerprints
        run: python tools/sl3p_sl3p422_compare1k.py
# Official LFU is held only in the runner's temporary filesystem; no artifact or binary is published.
