name: Lens layout evidence 1G

on:
  workflow_dispatch:
  push:
    branches: [research/lens-layout1g]
    paths:
      - 'tools/sl3p_lens_layout_probe1g.py'
      - 'tools/sl3p_lens_records1g.py'
      - 'tests/test_lens_records1g.py'
      - '.github/workflows/lens-layout1g.yml'

permissions:
  contents: read

concurrency:
  group: lens-layout1g-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Source-only guard
        run: python scripts/check_public_tree.py
      - name: Test LENS ranges, aliases and checksum hypotheses
        run: python -m unittest discover -s tests -p test_lens_records1g.py -v
      - name: Audit both independently pinned LENS packages
        run: python tools/sl3p_lens_records1g.py

# Read-only analysis; no firmware execution, uploaded binary artifacts,
# signing material, repository write-back, camera access or APK build.
