name: Panasonic format transition probe 1K
on:
  workflow_dispatch:
  push:
    branches: [research/panasonic-lineage1k]
    paths:
      - 'tools/sl3p_panasonic_transition1k.py'
      - '.github/workflows/panasonic-transition1k.yml'
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.13'}
      - run: python scripts/check_public_tree.py
      - run: python tools/sl3p_panasonic_transition1k.py
# Official G3/GH3 firmware is inspected transiently; no binaries are uploaded.
