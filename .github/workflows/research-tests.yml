name: Research tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-tests:
    name: Source guard and synthetic tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source without retaining credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Reject tracked local inputs and binary assets
        run: python scripts/check_public_tree.py
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run synthetic tests; require the complete 240-test research baseline
        shell: bash
        run: |
          python - <<'PY'
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover('tests')
          count = suite.countTestCases()
          if count < 240:
              raise SystemExit(f'Expected at least 240 baseline tests; discovered {count}')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY

# No firmware download, protected payload execution, automatic key screens,
# camera access, publication, repository write-back or APK build is performed.
