name: Public board source trace
on:
  push:
    branches: [research/loader-evidence1d]
    paths: [.github/workflows/board-source-trace.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    name: Trace ${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        part: [uboot, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: python scripts/check_public_tree.py
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Read fixed public source excerpts
        run: python tools/sl3p_board_trace.py --part '${{ matrix.part }}'
