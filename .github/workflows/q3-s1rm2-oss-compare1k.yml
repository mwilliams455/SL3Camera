name: Q3 versus S1RII OSS comparison 1K
on:
  workflow_dispatch:
  push:
    branches: [research/panasonic-lineage1k]
    paths:
      - 'tools/sl3p_q3_s1rm2_oss_compare1k.py'
      - 'tests/test_q3_s1rm2_oss_compare1k.py'
      - '.github/workflows/q3-s1rm2-oss-compare1k.yml'
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - run: python scripts/check_public_tree.py
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - name: Compare official Q3 and S1RII open-source platform archives
        run: python tools/sl3p_q3_s1rm2_oss_compare1k.py
# Published OSS only. No proprietary Panasonic or Leica camera firmware is fetched here.
