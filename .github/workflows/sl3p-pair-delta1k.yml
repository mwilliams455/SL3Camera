name: SL3-P official pair delta 1K
on:
  workflow_dispatch:
  push:
    branches: [research/panasonic-lineage1k]
    paths:
      - 'tools/sl3p_pair_delta1k.py'
      - 'tests/test_pair_delta1k.py'
      - '.github/workflows/sl3p-pair-delta1k.yml'
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - run: python scripts/check_public_tree.py
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - name: Compare official 4.2.1 and 4.2.2 without retaining firmware
        run: python tools/sl3p_pair_delta1k.py
# Firmware exists only in the ephemeral runner filesystem; no binary artifact is uploaded.
